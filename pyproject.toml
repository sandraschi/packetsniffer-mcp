[project]
name = "packetsniffer_mcp"
version = "0.1.0"
description = "MCP server for local network packet capture and PCAP file analysis"
authors = [{name = "MCP Studio"}]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.18.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "structlog>=24.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
    "scapy>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.16.0,<0.17",
]

[project.scripts]
packetsniffer_mcp = "packetsniffer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packetsniffer_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
